name: "🔒 Hook Fix: 5.10 + 6.12"
on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - version: "5.10-gki"
            branch: "android12-5.10"
            config: "gki_defconfig"
            tag: "android12-5.10"
            repo: "https://android.googlesource.com/kernel/common"
            clang_url: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz"
          - version: "6.12-gki"
            branch: "android16-6.12"
            config: "gki_defconfig"
            tag: "android16-6.12"
            repo: "https://android.googlesource.com/kernel/common"
            clang_url: "https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20241217-release/Clang-20.0.0git-20241217.tar.gz"

    runs-on: ubuntu-latest
    timeout-minutes: 90
    name: "Build ${{ matrix.tag }}"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup
      run: |
        sudo swapoff -a
        sudo fallocate -l 16G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null
        sudo docker image prune --all -f 2>/dev/null || true
        sudo apt-get update -qq
        sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
          git curl ccache zip unzip python3 cpio kmod dwarves libncurses-dev libdw-dev || true
        mkdir -p $GITHUB_WORKSPACE/build

    - name: Download kernel
      run: |
        cd $GITHUB_WORKSPACE/build
        git clone --depth=1 --branch ${{ matrix.branch }} ${{ matrix.repo }} kernel_src 2>&1 | tail -3

    - name: Download Clang
      run: |
        cd $GITHUB_WORKSPACE/build
        mkdir -p clang
        curl -sL "${{ matrix.clang_url }}" | tar xz -C clang
        clang/bin/clang --version | head -1

    - name: Configure + Build kernel
      run: |
        cd $GITHUB_WORKSPACE/build/kernel_src
        export PATH=$GITHUB_WORKSPACE/build/clang/bin:$PATH
        DEFCONFIG=${{ matrix.config }}
        [ ! -f arch/arm64/configs/$DEFCONFIG ] && DEFCONFIG=defconfig
        make ARCH=arm64 LLVM=1 LLVM_IAS=1 HOSTCC=gcc HOSTCXX=g++ \
          CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
          OBJCOPY=llvm-objcopy STRIP=llvm-strip OBJDUMP=llvm-objdump \
          CROSS_COMPILE=aarch64-linux-gnu- $DEFCONFIG 2>&1 | tail -2
        scripts/config --enable CONFIG_MODULES
        scripts/config --enable CONFIG_MODULE_UNLOAD
        scripts/config --enable CONFIG_KPROBES
        scripts/config --disable CONFIG_TRIM_UNUSED_KSYMS
        touch abi_symbollist.raw
        make ARCH=arm64 LLVM=1 LLVM_IAS=1 HOSTCC=gcc HOSTCXX=g++ \
          CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
          OBJCOPY=llvm-objcopy STRIP=llvm-strip OBJDUMP=llvm-objdump \
          CROSS_COMPILE=aarch64-linux-gnu- olddefconfig 2>&1 | tail -1
        make ARCH=arm64 LLVM=1 LLVM_IAS=1 HOSTCC=gcc HOSTCXX=g++ \
          CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
          OBJCOPY=llvm-objcopy STRIP=llvm-strip OBJDUMP=llvm-objdump \
          CROSS_COMPILE=aarch64-linux-gnu- Image modules -j$(nproc) 2>&1 | tail -5

    - name: Build hook .ko
      run: |
        cd $GITHUB_WORKSPACE/build/kernel_src
        export PATH=$GITHUB_WORKSPACE/build/clang/bin:$PATH
        git clone --depth=1 https://github.com/MarlonUSA/TearGame_KernelDriver_Android_WriteReadMemory.git \
          $GITHUB_WORKSPACE/build/TearGame
        MODDIR=$GITHUB_WORKSPACE/build/hook_mod
        mkdir -p $MODDIR
        cp $GITHUB_WORKSPACE/build/TearGame/hook/*.c $MODDIR/
        cp $GITHUB_WORKSPACE/build/TearGame/hook/*.h $MODDIR/
        echo "obj-m := usa_hook.o" > $MODDIR/Makefile
        echo "usa_hook-objs := entry.o memory.o process.o" >> $MODDIR/Makefile
        ls $MODDIR/
        make -C $GITHUB_WORKSPACE/build/kernel_src M=$MODDIR \
          ARCH=arm64 LLVM=1 LLVM_IAS=1 HOSTCC=gcc HOSTCXX=g++ \
          CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
          OBJCOPY=llvm-objcopy STRIP=llvm-strip OBJDUMP=llvm-objdump \
          CROSS_COMPILE=aarch64-linux-gnu- \
          KBUILD_MODPOST_WARN=1 modules 2>&1 | tail -8
        mkdir -p $GITHUB_WORKSPACE/build/output
        find $MODDIR -name "*.ko" -exec cp {} $GITHUB_WORKSPACE/build/output/USAHook_${{ matrix.version }}.ko \;
        ls -lh $GITHUB_WORKSPACE/build/output/ || echo "No .ko"

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: USAHook-${{ matrix.version }}
        path: build/output/*.ko
        if-no-files-found: warn
