name: "Build 6.12 GKI (Android 16)"
on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    name: "Build android16-6.12"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup environment
      run: |
        sudo swapoff -a
        sudo fallocate -l 16G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null
        sudo docker image prune --all -f 2>/dev/null || true
        df -h /
        sudo apt-get update -qq
        sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
          git curl python3 cpio kmod dwarves libncurses-dev libdw-dev libelf-dev || true
        mkdir -p $GITHUB_WORKSPACE/build

    - name: Download 6.12 kernel source (git clone only)
      run: |
        cd $GITHUB_WORKSPACE/build
        git clone --depth=1 --branch android16-6.12 \
          https://android.googlesource.com/kernel/common kernel_src 2>&1 | tail -3

    - name: Download Clang 20 + generate configs manually
      run: |
        cd $GITHUB_WORKSPACE/build
        mkdir -p clang
        curl -sL "https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20241217-release/Clang-20.0.0git-20241217.tar.gz" \
          | tar xz -C clang
        echo "Clang: $(clang/bin/clang --version | head -1)"

    - name: Configure and build kernel
      run: |
        cd $GITHUB_WORKSPACE/build/kernel_src
        export PATH=$GITHUB_WORKSPACE/build/clang/bin:$PATH

        # 6.12 用纯 LLVM, 不混用 GCC
        MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu-"

        # defconfig
        make $MAKE_ARGS gki_defconfig 2>&1 | tail -3

        scripts/config --enable CONFIG_MODULES
        scripts/config --enable CONFIG_MODULE_UNLOAD
        scripts/config --enable CONFIG_KPROBES
        scripts/config --disable CONFIG_TRIM_UNUSED_KSYMS
        # BTF 保持开启 (影响 struct module 布局/CRC)
        touch abi_symbollist.raw

        make $MAKE_ARGS olddefconfig 2>&1 | tail -2

        # 编译 — 全部日志输出到文件，不吞错误
        echo "=== Building kernel ==="
        make $MAKE_ARGS Image modules -j$(nproc) > /tmp/build.log 2>&1 || true
        echo "=== Last 50 lines ==="
        tail -50 /tmp/build.log
        echo "=== Errors ==="
        grep -iE "error:|fatal:|cannot|undefined" /tmp/build.log | head -20

        echo "=== Check results ==="
        ls -lh arch/arm64/boot/Image 2>/dev/null && echo "Image OK" || echo "Image FAILED"
        ls Module.symvers 2>/dev/null && echo "Module.symvers: $(wc -l < Module.symvers) symbols" || echo "No Module.symvers"
        ls scripts/module.lds 2>/dev/null && echo "module.lds OK" || echo "No module.lds"

    - name: Build TearGame .ko
      run: |
        cd $GITHUB_WORKSPACE/build/kernel_src
        export PATH=$GITHUB_WORKSPACE/build/clang/bin:$PATH
        MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu-"

        git clone --depth=1 https://github.com/MarlonUSA/TearGame_KernelDriver_Android_WriteReadMemory.git \
          $GITHUB_WORKSPACE/build/TearGame
        MODDIR=$GITHUB_WORKSPACE/build/teargame_mod
        mkdir -p $MODDIR
        cp $GITHUB_WORKSPACE/build/TearGame/dev/*.c $MODDIR/
        cp $GITHUB_WORKSPACE/build/TearGame/dev/*.h $MODDIR/
        echo "obj-m := usa_drv.o" > $MODDIR/Makefile
        echo "usa_drv-objs := entry.o memory.o process.o" >> $MODDIR/Makefile

        echo "=== Source ==="
        ls $MODDIR/

        make -C $GITHUB_WORKSPACE/build/kernel_src M=$MODDIR \
          $MAKE_ARGS KBUILD_MODPOST_WARN=1 modules 2>&1 | tail -10

        mkdir -p $GITHUB_WORKSPACE/build/output
        find $MODDIR -name "*.ko" -exec cp {} $GITHUB_WORKSPACE/build/output/TearGame_6.12-gki.ko \;
        ls -lh $GITHUB_WORKSPACE/build/output/ || echo "No .ko"

    - name: Upload .ko
      uses: actions/upload-artifact@v4
      with:
        name: TearGame-6.12-gki
        path: build/output/*.ko
        if-no-files-found: warn
